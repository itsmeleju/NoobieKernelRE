name: "Setup Clang & Kernel Build Environment"
description: "Installs dependencies, downloads and extracts the toolchain with caching support."

inputs:
  link:
    description: "Direct download link to the Clang toolchain archive"
    required: true
    default: "https://github.com/ZyCromerZ/Clang/releases/download/14.0.6-20260619-release/Clang-14.0.6-20260619.tar.gz"
  install-dir:
    description: "Extraction target directory"
    required: false
    default: "${{ github.workspace }}/clang"
  cache-hit:
    description: "Indicates whether the toolchain directory was restored from GitHub cache"
    required: false
    default: "false"

outputs:
  clang-dir:
    description: "Path to extracted toolchain"
    value: "${{ inputs.install-dir }}"
  clang-version:
    description: "Clang version string"
    value: "${{ steps.verify.outputs.clang_ver }}"

runs:
  using: "composite"
  steps:
    - name: Install System Dependencies
      shell: bash
      run: |
        echo "::group::Installing Kernel Build Dependencies"
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          bc bison build-essential ca-certificates curl file flex git \
          libelf-dev libssl-dev libncurses-dev jq lz4 pahole python3 unzip xz-utils zip zlib1g-dev zstd

        echo "pahole: $(command -v pahole)"
        pahole --version || true
        echo "::endgroup::"

    - name: Fetch and Extract Clang Toolchain
      shell: bash
      run: |
        echo "::group::Downloading & Extracting Clang Toolchain"
        TARGET_DIR="${{ inputs.install-dir }}"
        SOURCE_URL="${{ inputs.link }}"
        CACHE_STATUS="${{ inputs.cache-hit }}"

        if [ "$CACHE_STATUS" = "true" ] && [ -f "$TARGET_DIR/bin/clang" ]; then
          echo "[✓] Valid Clang installation restored from cache at $TARGET_DIR. Skipping download."
        else
          echo "[*] Toolchain not cached or incomplete. Fetching from source..."
          mkdir -p "$TARGET_DIR"
          ARCHIVE_FILE="clang-toolchain.archive"

          echo "[*] Source: $SOURCE_URL"
          echo "[*] Destination: $TARGET_DIR"

          curl -fSL --progress-bar "$SOURCE_URL" -o "$ARCHIVE_FILE"

          FILE_SIZE=$(ls -lh "$ARCHIVE_FILE" | awk '{print $5}')
          FILE_TYPE=$(file -b "$ARCHIVE_FILE")
          echo "[*] Downloaded archive size: $FILE_SIZE"
          echo "[*] Archive type: $FILE_TYPE"

          echo "[*] Extracting..."
          case "$FILE_TYPE" in
            *"gzip compressed data"*)
              tar -xzf "$ARCHIVE_FILE" -C "$TARGET_DIR"
              ;;
            *"XZ compressed data"*)
              tar -xJf "$ARCHIVE_FILE" -C "$TARGET_DIR"
              ;;
            *"Zstandard compressed data"*)
              tar --zstd -xf "$ARCHIVE_FILE" -C "$TARGET_DIR"
              ;;
            *"Zip archive data"*)
              unzip -q "$ARCHIVE_FILE" -d "$TARGET_DIR"
              ;;
            *)
              tar -xf "$ARCHIVE_FILE" -C "$TARGET_DIR"
              ;;
          esac

          rm -f "$ARCHIVE_FILE"
        fi

        echo "$TARGET_DIR/bin" >> $GITHUB_PATH
        echo "CLANG_PATH=$TARGET_DIR" >> $GITHUB_ENV
        echo "::endgroup::"

    - name: Diagnostic Verification
      id: verify
      shell: bash
      run: |
        echo "::group::Toolchain Diagnostic Report"
        CLANG_BIN="${{ inputs.install-dir }}/bin/clang"

        if [ ! -f "$CLANG_BIN" ]; then
          echo "::error::Clang binary not found at $CLANG_BIN! Check extraction directory structure."
          exit 1
        fi

        CLANG_VER=$("$CLANG_BIN" --version | head -n 1)
        LLD_VER=$("${{ inputs.install-dir }}/bin/ld.lld" --version | head -n 1 || echo "lld not present")
        PAHOLE_VER=$(pahole --version 2>&1 || echo "pahole unavailable")

        echo "clang_ver=$CLANG_VER" >> $GITHUB_OUTPUT

        echo "Clang Compiler : $CLANG_VER"
        echo "LLD Linker     : $LLD_VER"
        echo "Pahole         : $PAHOLE_VER"
        echo "Host GCC       : $(gcc --version | head -n 1)"
        echo "::endgroup::"
