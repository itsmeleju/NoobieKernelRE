name: "Setup Clang & Kernel Build Environment"
description: "Installs Linux kernel build dependencies, downloads, and configures the Clang toolchain."

inputs:
  link:
    description: "Direct download link to the Clang toolchain archive (.tar.gz, .tar.xz, .tar.zst)"
    required: false
    default: "https://github.com/ZyCromerZ/Clang/releases/download/14.0.6-20260619-release/Clang-14.0.6-20260619.tar.gz"
  install-dir:
    description: "Directory where the toolchain will be extracted"
    required: false
    default: "${{ github.workspace }}/toolchain/clang"

outputs:
  clang-dir:
    description: "Absolute path to the extracted Clang toolchain directory"
    value: "${{ inputs.install-dir }}"
  clang-version:
    description: "Installed Clang compiler version string"
    value: "${{ steps.verify.outputs.clang_ver }}"

runs:
  using: "composite"
  steps:
    - name: Install System Dependencies
      shell: bash
      run: |
        echo "::group::Installing Kernel Build Dependencies"
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          bc bison build-essential ca-certificates curl file flex git \
          libelf-dev libssl-dev libncurses-dev jq lz4 pahole python3 unzip xz-utils zip zlib1g-dev zstd

        echo "pahole: $(command -v pahole)"
        pahole --version || true
        echo "::endgroup::"

    - name: Fetch and Extract Clang Toolchain
      shell: bash
      run: |
        echo "::group::Downloading & Extracting Clang Toolchain"
        TARGET_DIR="${{ inputs.install-dir }}"
        SOURCE_URL="${{ inputs.link }}"
        ARCHIVE_FILE="clang-toolchain.archive"

        mkdir -p "$TARGET_DIR"

        echo "Download source: $SOURCE_URL"
        echo "Target directory: $TARGET_DIR"

        # Fetch with curl showing real-time progress bar, redirects, and failure exit codes
        curl -fSL --progress-bar "$SOURCE_URL" -o "$ARCHIVE_FILE"

        FILE_SIZE=$(ls -lh "$ARCHIVE_FILE" | awk '{print $5}')
        FILE_TYPE=$(file -b "$ARCHIVE_FILE")
        echo "Downloaded file size: $FILE_SIZE"
        echo "Archive detected as: $FILE_TYPE"

        echo "Extracting archive..."
        case "$FILE_TYPE" in
          *"gzip compressed data"*)
            tar -xzf "$ARCHIVE_FILE" -C "$TARGET_DIR"
            ;;
          *"XZ compressed data"*)
            tar -xJf "$ARCHIVE_FILE" -C "$TARGET_DIR"
            ;;
          *"Zstandard compressed data"*)
            tar --zstd -xf "$ARCHIVE_FILE" -C "$TARGET_DIR"
            ;;
          *"Zip archive data"*)
            unzip -q "$ARCHIVE_FILE" -d "$TARGET_DIR"
            ;;
          *)
            tar -xf "$ARCHIVE_FILE" -C "$TARGET_DIR"
            ;;
        esac

        rm -f "$ARCHIVE_FILE"

        # Export binary path to runner environment
        echo "$TARGET_DIR/bin" >> $GITHUB_PATH
        echo "CLANG_PATH=$TARGET_DIR" >> $GITHUB_ENV
        echo "::endgroup::"

    - name: Verify Environment and Generate Report
      id: verify
      shell: bash
      run: |
        echo "::group::Toolchain Diagnostic Report"
        CLANG_BIN="${{ inputs.install-dir }}/bin/clang"

        if [ ! -f "$CLANG_BIN" ]; then
          echo "::error::Clang binary not found at $CLANG_BIN. Extraction may have failed."
          exit 1
        fi

        CLANG_VER=$("$CLANG_BIN" --version | head -n 1)
        LLD_VER=$("${{ inputs.install-dir }}/bin/ld.lld" --version | head -n 1 || echo "lld not present")
        PAHOLE_VER=$(pahole --version 2>&1 || echo "pahole version check failed")

        echo "clang_ver=$CLANG_VER" >> $GITHUB_OUTPUT

        echo "Compiler : $CLANG_VER"
        echo "Linker   : $LLD_VER"
        echo "Pahole   : $PAHOLE_VER"
        echo "Host GCC : $(gcc --version | head -n 1)"
        echo "::endgroup::"

        # Write formatted report to GitHub Step Summary
        cat << EOF >> $GITHUB_STEP_SUMMARY
        ### Clang Toolchain Setup Summary
        - **Source URL:** \`${{ inputs.link }}\`
        - **Install Path:** \`${{ inputs.install-dir }}\`
        - **Clang Version:** \`$CLANG_VER\`
        - **LLD Version:** \`$LLD_VER\`
        - **Pahole:** \`$PAHOLE_VER\`
        EOF
