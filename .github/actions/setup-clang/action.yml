name: Setup Clang
description: Resolve, cache, install, and verify a kernel Clang toolchain.
inputs:
  toolchain:
    description: ZyCromerZ or Neutron
    required: true
  version_clang:
    description: Exact GitHub release/tag. Empty uses the action default.
    required: false
    default: ""
outputs:
  version:
    description: Resolved toolchain release/tag
    value: ${{ steps.setup.outputs.version }}
  clang_path:
    description: Selected Clang bin directory
    value: ${{ steps.setup.outputs.clang_path }}
runs:
  using: composite
  steps:
    - name: Cache ZyCromerZ default
      if: ${{ inputs.version_clang == '' && inputs.toolchain == 'ZyCromerZ' }}
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/noobie-clang/ZyCromerZ/Clang-16.0.6-20260510-release
        key: ${{ runner.os }}-kernel-clang-ZyCromerZ-Clang-16.0.6-20260510-release
    - name: Cache Neutron default
      if: ${{ inputs.version_clang == '' && inputs.toolchain == 'Neutron' }}
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/noobie-clang/Neutron/06092026
        key: ${{ runner.os }}-kernel-clang-Neutron-06092026
    - name: Cache selected release
      if: ${{ inputs.version_clang != '' }}
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/noobie-clang/${{ inputs.toolchain }}/${{ inputs.version_clang }}
        key: ${{ runner.os }}-kernel-clang-${{ inputs.toolchain }}-${{ inputs.version_clang }}
    - name: Resolve and install Clang
      id: setup
      shell: bash
      env:
        TOOLCHAIN: ${{ inputs.toolchain }}
        VERSION_CLANG: ${{ inputs.version_clang }}
        TOOLCHAIN_ROOT: ${{ runner.temp }}/noobie-clang
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        python3 "$GITHUB_ACTION_PATH/action.py"