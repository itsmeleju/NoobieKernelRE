name: Setup Clang
description: Resolve, cache, install and verify a kernel Clang toolchain

inputs:
  toolchain:
    description: ZyCromerZ or Neutron
    required: true
  version_clang:
    description: Exact GitHub release/tag. Empty uses the default in action.py
    required: false
    default: ""

outputs:
  version:
    description: Resolved toolchain release/tag
    value: ${{ steps.setup.outputs.version }}
  clang_path:
    description: Selected Clang bin directory
    value: ${{ steps.setup.outputs.clang_path }}

runs:
  using: composite
  steps:
    # action.py resolves "latest" itself, so only a pinned tag has a stable cache key.
    # Empty version_clang = always fetch the newest release (never a stale cache).
    - name: Cache pinned toolchain
      if: ${{ inputs.version_clang != '' }}
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/noobie-clang/${{ inputs.toolchain }}/${{ inputs.version_clang }}
        key: ${{ runner.os }}-clang-${{ inputs.toolchain }}-${{ inputs.version_clang }}

    - name: Resolve and install Clang
      id: setup
      shell: bash
      env:
        TOOLCHAIN: ${{ inputs.toolchain }}
        VERSION_CLANG: ${{ inputs.version_clang }}
        TOOLCHAIN_ROOT: ${{ runner.temp }}/noobie-clang
        GITHUB_TOKEN: ${{ github.token }}
      run: python3 "$GITHUB_ACTION_PATH/action.py"   # also verifies binaries and prints clang --version
