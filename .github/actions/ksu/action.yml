name: "KernelSU / SU Setup"
description: "Automatically integrates SU driver sources into the Android kernel tree."

inputs:
  repository:
    description: "SU Git repository URL"
    required: false
    default: "https://github.com/Baka-SU/BakaSU"

  branch:
    description: "Branch, tag, or commit to checkout"
    required: false
    default: "sync-susf"

  target-link:
    description: "Internal driver directory name inside drivers/"
    required: false
    default: "kernelsu"

  DEFCONFIG_PATH-path:
    description: "Path to the kernel defconfig"
    required: true
    
  defconfig:
        description: "Kernel defconfig name"
        required: true
        default: "Noobie_SUSFS_defconfig"

outputs:
  ksu-version:
    description: "Detected KernelSU/SU commit hash"
    value: "${{ steps.integrate.outputs.ksu_ver }}"

runs:
  using: "composite"

  steps:
    - name: Integrate KSU Driver
      id: integrate
      shell: bash
      run: |
        echo "::group::KernelSU / SU Integration"
        set -euo pipefail

        REPO_URL="${{ inputs.repository }}"
        BRANCH="${{ inputs.branch }}"
        TARGET_LINK="${{ inputs.target-link }}"
        TARGET_DIR="drivers/${TARGET_LINK}"

        echo "[*] Repository     : ${REPO_URL}"
        echo "[*] Ref            : ${BRANCH}"
        echo "[*] Driver Path    : ${TARGET_DIR}"
        echo "[*] Defconfig      : ${DEFCONFIG_PATH}"

        # ------------------------------------------------------------
        # 1. Install KernelSU
        # ------------------------------------------------------------
          echo "[*] Downloading SU setup.sh..."
          curl -LSs "https://raw.githubusercontent.com/Baka-SU/BakaSU/main/kernel/setup.sh" | bash -s sync-susfs
          
        # ------------------------------------------------------------
        # 2. Verify driver directory
        # ------------------------------------------------------------

        if [ ! -d "${TARGET_DIR}" ]; then
          echo "[!] ERROR: ${TARGET_DIR} was not created."
          echo "[!] Existing drivers/kernelsu directories:"
          find drivers -maxdepth 2 -type d -iname '*kernelsu*' -print || true
          exit 1
        fi

        echo "[✓] SU driver found at ${TARGET_DIR}"
        
        echo "==> Checking for custom selinux_hide.c override file..."
    
 	# Define paths (adjust paths if your source structure differs)
    	OVERRIDE_SOURCE="path/to/your/custom_selinux_hide.c"
    	TARGET_FILE="KernelSU/kernel/feature/selinux_hide.c"
    
    	# Check if the override file exists in your repository or patch folder
   	if [ -f "$OVERRIDE_SOURCE" ]; then
    	  echo "[+] Found override file: $OVERRIDE_SOURCE"
      
    	# Ensure target directory exists
      	mkdir -p "$(dirname "$TARGET_FILE")"
      
      	# Replace/override the file
      	cp -f "$OVERRIDE_SOURCE" "$TARGET_FILE"
     	echo "[+] Successfully replaced $TARGET_FILE with custom override."
    	else
      		echo "--------------------------------------------------------"
      		echo "[-] ERROR: Required override file '$OVERRIDE_SOURCE' not found!"
      		echo "[-] Compilation aborted due to missing required patch file."
      		echo "--------------------------------------------------------"
      	exit 1
    	fi
	  

        # ------------------------------------------------------------
        # 3. Detect SU commit/version
        # ------------------------------------------------------------

        SU_COMMIT="unknown"
        SU_BRANCH="unknown"

        echo "[*] Checking SU version..."

        pushd "${TARGET_DIR}" > /dev/null

        if git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
          SU_COMMIT="$(git rev-parse --short HEAD)"
          SU_BRANCH="$(git rev-parse --abbrev-ref HEAD)"

          echo "[✓] SU Branch : ${SU_BRANCH}"
          echo "[✓] SU Commit : ${SU_COMMIT}"
        else
          echo "[i] SU installed as a static directory."
        fi

        if [ -f "kernel/Makefile" ]; then
          echo "[*] KernelSU version information:"
          grep -E "KSU_VERSION|DKSU_VERSION|VERSION" \
            kernel/Makefile || true
        fi

        popd > /dev/null

        # Export output
        echo "ksu_ver=${SU_COMMIT}" >> "$GITHUB_OUTPUT"

        # ------------------------------------------------------------
        # 5. Verify Makefile integration
        # ------------------------------------------------------------

        echo "[*] Checking drivers/Makefile..."

        if grep -Eq \
          "obj-\$\(CONFIG_KSU\)[[:space:]]*\+=[[:space:]]*${TARGET_LINK}/" \
          drivers/Makefile; then

          echo "[✓] drivers/Makefile already contains KSU binding"

        else

          echo "[*] Adding KSU Makefile binding..."

          printf '\nobj-$(CONFIG_KSU) += %s/\n' "${TARGET_LINK}" \
            >> drivers/Makefile

          echo "[✓] KSU Makefile binding added"
        fi

        # ------------------------------------------------------------
        # 7. Verify defconfig
        # ------------------------------------------------------------

        DEFCONFIG_NAME="${{ inputs.defconfig }}"
        DEFCONFIG_PATH="arch/arm64/configs/${DEFCONFIG_NAME}"

        echo "[*] Checking target defconfig..."
        echo "[*] Target: ${DEFCONFIG_PATH}"

        if [ ! -f "${DEFCONFIG_PATH}" ]; then
            echo "[!] ERROR: Defconfig not found:"
            echo "    ${DEFCONFIG}"
            exit 1
        fi
        echo "[✓] Defconfig found: ${DEFCONFIG_PATH}"

        # ------------------------------------------------------------
        # 8. Enable CONFIG_KSU
        # ------------------------------------------------------------

        echo "[*] Enabling CONFIG_KSU..."

        # Remove old CONFIG_KSU entries.
        sed -i '/^[#[:space:]]*CONFIG_KSU[=[:space:]]/d' \
          "${DEFCONFIG_PATH}"

        sed -i '/^CONFIG_KSU=/d' \
          "${DEFCONFIG_PATH}"

        # Add KSU.
        printf '\n# KernelSU\nCONFIG_KSU=y\n' \
          >> "${DEFCONFIG_PATH}"

        echo "[✓] CONFIG_KSU=y added to ${DEFCONFIG_PATH}"

        # ------------------------------------------------------------
        # 10. Final verification
        # ------------------------------------------------------------

        echo
        echo "========== KernelSU Integration =========="

        echo "[*] Driver:"
        echo "    ${TARGET_DIR}"

        echo "[*] Commit:"
        echo "    ${SU_COMMIT}"

        echo "[*] Defconfig:"
        echo "    ${DEFCONFIG_PATH}"

        echo "[*] Configuration:"
        grep -E \
          '^CONFIG_KSU(=|_)' \
          "${DEFCONFIG_PATH}" || true

        echo "=========================================="

        echo "[✓] SU integration completed successfully."

        echo "::endgroup::"

        # ------------------------------------------------------------
        # GitHub Step Summary
        # ------------------------------------------------------------

        cat >> "$GITHUB_STEP_SUMMARY" << EOF
        ### SU Integration Summary

        - **Repository:** \`${REPO_URL}\`
        - **Requested Ref:** \`${BRANCH}\`
        - **Detected Commit:** \`${SU_COMMIT}\`
        - **Driver Path:** \`${TARGET_DIR}\`
        - **Defconfig:** \`${DEFCONFIG_PATH}\`
        - **CONFIG_KSU:** Enabled
        EOF