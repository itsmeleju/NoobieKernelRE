name: 'Integrate NoMount Setup'
description: 'Downloads and patches the Linux kernel tree with the NoMount module and verifies Kconfig/Makefile setup'
author: 'maxsteeel'

inputs:
  kernel-dir:
    description: 'Path to the Linux kernel source directory'
    required: false
    default: '.'
  enable-config:
    description: 'Append CONFIG_NOMOUNT=y to .config if it exists'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Download and Run Setup Script
      shell: bash
      working-directory: ${{ inputs.kernel-dir }}
      run: |
        curl -fsSL https://raw.githubusercontent.com/maxsteeel/nomount/refs/heads/dev/kernel/setup.sh | bash -

    - name: Patch fs/Kconfig
      shell: bash
      working-directory: ${{ inputs.kernel-dir }}
      run: |
        KCONFIG_FILE="fs/Kconfig"
        SOURCE_LINE='source "fs/nomount/Kconfig"'
        if [ -f "$KCONFIG_FILE" ]; then
          if ! grep -Fxq "$SOURCE_LINE" "$KCONFIG_FILE"; then
            echo "$SOURCE_LINE" >> "$KCONFIG_FILE"
            echo "Added '$SOURCE_LINE' to $KCONFIG_FILE"
          else
            echo "'$SOURCE_LINE' already present in $KCONFIG_FILE"
          fi
        else
          echo "Warning: $KCONFIG_FILE not found, skipping."
        fi

    - name: Patch fs/Makefile
      shell: bash
      working-directory: ${{ inputs.kernel-dir }}
      run: |
        MAKEFILE="fs/Makefile"
        OBJ_LINE='obj-$(CONFIG_NOMOUNT) += nomount/'
        if [ -f "$MAKEFILE" ]; then
          if ! grep -Fxq "$OBJ_LINE" "$MAKEFILE"; then
            echo "$OBJ_LINE" >> "$MAKEFILE"
            echo "Added '$OBJ_LINE' to $MAKEFILE"
          else
            echo "'$OBJ_LINE' already present in $MAKEFILE"
          fi
        else
          echo "Warning: $MAKEFILE not found, skipping."
        fi

    - name: Enable CONFIG_NOMOUNT in .config
      if: ${{ inputs.enable-config == 'true' }}
      shell: bash
      working-directory: ${{ inputs.kernel-dir }}
      run: |
        if [ -f ".config" ]; then
          if grep -q "^# CONFIG_NOMOUNT is not set" .config; then
            sed -i 's/^# CONFIG_NOMOUNT is not set/CONFIG_NOMOUNT=y/' .config
          elif ! grep -q "^CONFIG_NOMOUNT=" .config; then
            echo "CONFIG_NOMOUNT=y" >> .config
          fi
          echo "CONFIG_NOMOUNT=y ensured in .config"
        fi

    - name: Verify Setup
      shell: bash
      working-directory: ${{ inputs.kernel-dir }}
      run: |
        echo "=== Verifying NoMount Setup ==="
        test -d "fs/nomount" || { echo "Error: fs/nomount directory missing"; exit 1; }
        grep -Fxq 'source "fs/nomount/Kconfig"' fs/Kconfig || { echo "Error: Missing source entry in fs/Kconfig"; exit 1; }
        grep -Fxq 'obj-$(CONFIG_NOMOUNT) += nomount/' fs/Makefile || { echo "Error: Missing build entry in fs/Makefile"; exit 1; }
        echo "Verification passed: NoMount is integrated into the kernel tree."
