name: Setup Build Environment
description: Setup dependencies and ZyCromerZ LLVM toolchain

runs:
  using: composite

  steps:
    - name: Install Build Dependencies
      shell: bash
      run: |
        set -e

        sudo apt-get update

        sudo apt-get install -y --no-install-recommends \
          bc \
          bison \
          build-essential \
          flex \
          git \
          libelf-dev \
          liblz4-tool \
          libncurses-dev \
          libssl-dev \
          python3 \
          python-is-python3 \
          unzip \
          u-boot-tools \
          wget \
          curl \
          zip

    - name: Cache ZyCromerZ Clang
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/toolchain
        key: zycromerz-clang-15-20260801-v3

    - name: Download ZyCromerZ Clang 15
      shell: bash
      run: |
        set -e

        TOOLCHAIN="${GITHUB_WORKSPACE}/toolchain"
        ARCHIVE="${RUNNER_TEMP}/clang15.tar.gz"

        URL="https://github.com/ZyCromerZ/Clang/releases/download/15.0.7-20260801-release/Clang-15.0.7-20260801.tar.gz"

        if [ -x "${TOOLCHAIN}/bin/clang" ]; then
          echo "Clang already exists in cache."
          exit 0
        fi

        echo "Clang not found. Downloading ZyCromerZ Clang 15..."

        rm -rf "${TOOLCHAIN}"
        mkdir -p "${TOOLCHAIN}"

        curl -fL \
          --retry 5 \
          --retry-delay 3 \
          --connect-timeout 30 \
          --max-time 1800 \
          -o "${ARCHIVE}" \
          "${URL}"

        test -s "${ARCHIVE}"

        echo "Download completed:"
        ls -lh "${ARCHIVE}"

        echo "Checking archive..."

        tar -tzf "${ARCHIVE}" > "${RUNNER_TEMP}/clang-manifest.txt"

        echo "Archive contents:"
        head -30 "${RUNNER_TEMP}/clang-manifest.txt"

        echo
        echo "Searching for Clang..."

        if ! grep -E '(^|/)bin/clang$' "${RUNNER_TEMP}/clang-manifest.txt"; then
          echo "::error::clang was not found inside the downloaded archive."

          echo "Possible clang files:"
          grep -E '(^|/)clang($|/)' \
            "${RUNNER_TEMP}/clang-manifest.txt" \
            | head -50 || true

          exit 1
        fi

        echo "Extracting Clang..."

        tar -xzf "${ARCHIVE}" -C "${TOOLCHAIN}"

        rm -f "${ARCHIVE}"

        echo "Extraction completed."

        echo "Searching extracted toolchain..."

        CLANG="$(find -L "${TOOLCHAIN}" \
          -type f \
          -name clang \
          -print -quit)"

        if [ -z "${CLANG}" ]; then
          echo "::error::Clang was found in the archive but not after extraction."

          echo "Extracted files:"
          find -L "${TOOLCHAIN}" -maxdepth 4 -type f | head -100 || true

          exit 1
        fi

        echo "Clang found:"
        echo "${CLANG}"
        
    - name: Configure LLVM
      shell: bash
      run: |
        set -e

        TOOLCHAIN="${GITHUB_WORKSPACE}/toolchain"

        CLANG="$(find -L "${TOOLCHAIN}" \
          -type f \
          -name clang \
          -print -quit)"

        if [ -z "${CLANG}" ]; then
          echo "::error::Clang executable not found."

          echo "Toolchain tree:"
          find -L "${TOOLCHAIN}" -maxdepth 4 -print | head -150 || true

          exit 1
        fi

        BIN_DIR="$(dirname "${CLANG}")"

        echo "========================================"
        echo "LLVM TOOLCHAIN"
        echo "========================================"

        echo "Clang: ${CLANG}"
        echo "Bin:   ${BIN_DIR}"

        echo "${BIN_DIR}" >> "${GITHUB_PATH}"

        {
          echo "TOOLCHAIN_BIN=${BIN_DIR}"
          echo "ARCH=arm64"
          echo "SUBARCH=arm64"
          echo "LLVM=1"
          echo "LLVM_IAS=1"
          echo "CC=clang"
          echo "LD=ld.lld"
          echo "AR=llvm-ar"
          echo "NM=llvm-nm"
          echo "OBJCOPY=llvm-objcopy"
          echo "OBJDUMP=llvm-objdump"
          echo "STRIP=llvm-strip"
          echo "READELF=llvm-readelf"
        } >> "${GITHUB_ENV}"

    - name: Verify LLVM
      shell: bash
      run: |
        set -e

        export PATH="${TOOLCHAIN_BIN}:${PATH}"

        echo "========================================"
        echo "VERIFYING LLVM TOOLCHAIN"
        echo "========================================"

        echo
        echo "Clang:"
        command -v clang
        clang --version | head -n 1

        echo
        echo "LLD:"
        command -v ld.lld
        ld.lld --version | head -n 1

        echo
        echo "LLVM tools:"

        for tool in \
          llvm-ar \
          llvm-nm \
          llvm-objcopy \
          llvm-objdump \
          llvm-strip \
          llvm-readelf
        do
          if ! command -v "${tool}" >/dev/null 2>&1; then
            echo "::error::Missing ${tool}"
            exit 1
          fi

          echo "OK: ${tool}"
        done

        echo
        echo "LLVM toolchain ready."
