name: Setup Build Environment

description: Setup dependencies and ZyCromerZ LLVM toolchain

runs:
  using: composite

  steps:

    - name: Install Build Dependencies
      shell: bash
      run: |
        set -e

        sudo apt-get update

        sudo apt-get install -y --no-install-recommends \
          bc \
          bison \
          build-essential \
          flex \
          git \
          libelf-dev \
          liblz4-tool \
          libncurses-dev \
          libssl-dev \
          python3 \
          python-is-python3 \
          unzip \
          u-boot-tools \
          wget \
          curl \
          zip

    - name: Cache ZyCromerZ Clang
      id: clang-cache
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/toolchain
        key: zycromerz-clang-${{ runner.os }}-${{ runner.arch }}-latest

    - name: Download ZyCromerZ Clang (v14)
      if: steps.clang-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -e

        TOOLCHAIN="${GITHUB_WORKSPACE}/toolchain"
        mkdir -p "${TOOLCHAIN}"

        echo "Fetching latest ZyCromerZ Clang-14 release..."

        # Query ZyCromerZ releases specifically matching Clang 14 tag
        URL=$(curl -s https://api.github.com/repos/ZyCromerZ/Clang/releases | jq -r '
          [.[] | select(.tag_name | contains("14."))] | first | .assets[]
          | select(.name | endswith(".tar.gz") or endswith(".tar.xz"))
          | .browser_download_url
        ')

        if [ -z "${URL}" ] || [ "${URL}" = "null" ]; then
          echo "ERROR: Unable to locate a valid Clang archive download URL."
          exit 1
        fi

        echo "Downloading: ${URL}"
        ARCHIVE="${RUNNER_TEMP}/clang.tar.gz"

        curl -sSL --retry 3 --output "${ARCHIVE}" "${URL}"

        echo "Extracting toolchain to ${TOOLCHAIN}..."
        tar -xf "${ARCHIVE}" -C "${TOOLCHAIN}"
        rm -f "${ARCHIVE}"

        echo "Clang setup completed successfully."

    - name: Configure LLVM
      shell: bash
      run: |
        set -e

        TOOLCHAIN="${GITHUB_WORKSPACE}/toolchain"

        CLANG="$(find "${TOOLCHAIN}" -type f -path '*/bin/clang' | head -n 1)"

        if [ -z "${CLANG}" ]; then
          echo "ERROR: clang not found in toolchain."
          exit 1
        fi

        BIN_DIR="$(dirname "${CLANG}")"

        echo "${BIN_DIR}" >> "${GITHUB_PATH}"

        {
          echo "ARCH=arm64"
          echo "SUBARCH=arm64"
          echo "LLVM=1"
          echo "LLVM_IAS=1"
          echo "CC=clang"
          echo "LD=ld.lld"
          echo "AR=llvm-ar"
          echo "NM=llvm-nm"
          echo "OBJCOPY=llvm-objcopy"
          echo "OBJDUMP=llvm-objdump"
          echo "STRIP=llvm-strip"
          echo "READELF=llvm-readelf"
          echo "TOOLCHAIN_BIN=${BIN_DIR}"
        } >> "${GITHUB_ENV}"

    - name: Verify Toolchain
      shell: bash
      run: |
        set -e

        export PATH="${GITHUB_WORKSPACE}/toolchain/bin:${PATH}"

        echo "Clang:"
        clang --version | head -n 1

        echo "LLD:"
        ld.lld --version | head -n 1

        for tool in \
          llvm-ar \
          llvm-nm \
          llvm-objcopy \
          llvm-objdump \
          llvm-strip
        do
          command -v "${tool}" >/dev/null || {
            echo "ERROR: Missing ${tool}"
            exit 1
          }
        done

        echo "LLVM toolchain ready."
