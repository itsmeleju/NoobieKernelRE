name: Setup Build Environment
description: Setup kernel build dependencies and ZyCromerZ LLVM 15

runs:
  using: composite

  steps:
    - name: Install Dependencies
      shell: bash
      run: |
        set -e

        sudo apt-get update

        sudo apt-get install -y --no-install-recommends \
          bc \
          bison \
          build-essential \
          flex \
          git \
          libelf-dev \
          liblz4-tool \
          libncurses-dev \
          libssl-dev \
          python3 \
          python-is-python3 \
          unzip \
          u-boot-tools \
          wget \
          curl \
          zip

    - name: Cache Clang
      id: clang-cache
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/toolchain
        key: zycromerz-clang-15-20260801-v2

    - name: Install Clang
      shell: bash
      run: |
        set -e

        TOOLCHAIN="${GITHUB_WORKSPACE}/toolchain"
        ARCHIVE="${RUNNER_TEMP}/clang15.tar.gz"
        URL="https://github.com/ZyCromerZ/Clang/releases/download/15.0.7-20260801-release/Clang-15.0.7-20260801.tar.gz"

        if find "${TOOLCHAIN}" -type f -name clang -perm -111 | grep -q .; then
          echo "Clang cache found."
        else
          echo "Clang not found. Downloading..."

          rm -rf "${TOOLCHAIN}"
          mkdir -p "${TOOLCHAIN}"

          curl -fL \
            --retry 5 \
            --retry-delay 3 \
            --connect-timeout 30 \
            --max-time 1800 \
            -o "${ARCHIVE}" \
            "${URL}"

          test -s "${ARCHIVE}"

          echo "Extracting Clang..."

          tar -xzf "${ARCHIVE}" -C "${TOOLCHAIN}"

          rm -f "${ARCHIVE}"
        fi

        CLANG="$(find "${TOOLCHAIN}" \
          -type f \
          -name clang \
          -perm -111 \
          -print -quit)"

        if [ -z "${CLANG}" ]; then
          echo "::error::Clang executable was not found."
          echo "Toolchain contents:"
          find "${TOOLCHAIN}" -maxdepth 3 -type f | head -100
          exit 1
        fi

        BIN_DIR="$(dirname "${CLANG}")"

        echo "Clang found:"
        echo "${CLANG}"

        echo "TOOLCHAIN_BIN=${BIN_DIR}" >> "${GITHUB_ENV}"
        echo "${BIN_DIR}" >> "${GITHUB_PATH}"

    - name: Configure LLVM
      shell: bash
      run: |
        set -e

        test -n "${TOOLCHAIN_BIN}"
        test -x "${TOOLCHAIN_BIN}/clang"

        {
          echo "ARCH=arm64"
          echo "SUBARCH=arm64"
          echo "LLVM=1"
          echo "LLVM_IAS=1"
          echo "CC=clang"
          echo "LD=ld.lld"
          echo "AR=llvm-ar"
          echo "NM=llvm-nm"
          echo "OBJCOPY=llvm-objcopy"
          echo "OBJDUMP=llvm-objdump"
          echo "STRIP=llvm-strip"
          echo "READELF=llvm-readelf"
        } >> "${GITHUB_ENV}"

    - name: Verify LLVM
      shell: bash
      run: |
        set -e

        export PATH="${TOOLCHAIN_BIN}:${PATH}"

        echo "========================================"
        echo "LLVM TOOLCHAIN"
        echo "========================================"

        echo "PATH: ${TOOLCHAIN_BIN}"

        command -v clang
        command -v ld.lld
        command -v llvm-ar
        command -v llvm-nm
        command -v llvm-objcopy
        command -v llvm-objdump
        command -v llvm-strip

        echo
        clang --version | head -n 1
        ld.lld --version | head -n 1

        echo
        echo "LLVM toolchain ready."
