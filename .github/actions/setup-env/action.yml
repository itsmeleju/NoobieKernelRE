name: Setup Build Environment
description: Setup dependencies and ZyCromerZ LLVM toolchain

runs:
  using: composite

  steps:
    - name: Install Build Dependencies
      shell: bash
      run: |
        set -e

        sudo apt-get update

        sudo apt-get install -y --no-install-recommends \
          bc \
          bison \
          build-essential \
          flex \
          git \
          libelf-dev \
          liblz4-tool \
          libncurses-dev \
          libssl-dev \
          python3 \
          python-is-python3 \
          unzip \
          u-boot-tools \
          wget \
          curl \
          zip

    - name: Cache ZyCromerZ Clang
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/toolchain
        key: zycromerz-clang-15-20260801-v3

    - name: Download ZyCromerZ Clang 15
      shell: bash
      run: |
        set -e

        TOOLCHAIN="${GITHUB_WORKSPACE}/toolchain"
        ARCHIVE="${RUNNER_TEMP}/clang15.tar.gz"

        URL="https://github.com/ZyCromerZ/Clang/releases/download/15.0.7-20260801-release/Clang-15.0.7-20260801.tar.gz"

        if [ -x "${TOOLCHAIN}/bin/clang" ]; then
          echo "Clang already exists."
        else
          echo "Clang not found. Downloading..."

          rm -rf "${TOOLCHAIN}"
          mkdir -p "${TOOLCHAIN}"

          curl -fL \
            --retry 5 \
            --retry-delay 3 \
            --connect-timeout 30 \
            --max-time 1800 \
            -o "${ARCHIVE}" \
            "${URL}"

          test -s "${ARCHIVE}"

          echo "Checking archive..."
          tar -tzf "${ARCHIVE}" | head -20

          echo "Extracting Clang..."

          tar -xzf "${ARCHIVE}" -C "${TOOLCHAIN}"

          rm -f "${ARCHIVE}"
        fi

    - name: Locate Clang
      shell: bash
      run: |
        set -e

        TOOLCHAIN="${GITHUB_WORKSPACE}/toolchain"

        CLANG="$(find -L "${TOOLCHAIN}" \
          -type f \
          -name clang \
          -executable \
          -print -quit)"

        if [ -z "${CLANG}" ]; then
          echo "::error::Clang executable was not found."

          echo
          echo "Toolchain directory:"
          find "${TOOLCHAIN}" -maxdepth 4 -print | head -200

          echo
          echo "Possible Clang files:"
          find -L "${TOOLCHAIN}" \
            \( -name 'clang' -o -name 'clang-*' \) \
            -print | head -50

          exit 1
        fi

        BIN_DIR="$(dirname "${CLANG}")"

        echo "Clang:"
        echo "${CLANG}"

        echo
        echo "LLVM bin:"
        echo "${BIN_DIR}"

        echo "${BIN_DIR}" >> "${GITHUB_PATH}"

        {
          echo "TOOLCHAIN_BIN=${BIN_DIR}"
          echo "CC=clang"
          echo "LD=ld.lld"
          echo "AR=llvm-ar"
          echo "NM=llvm-nm"
          echo "OBJCOPY=llvm-objcopy"
          echo "OBJDUMP=llvm-objdump"
          echo "STRIP=llvm-strip"
          echo "READELF=llvm-readelf"
          echo "LLVM=1"
          echo "LLVM_IAS=1"
        } >> "${GITHUB_ENV}"

    - name: Verify LLVM
      shell: bash
      run: |
        set -e

        export PATH="${TOOLCHAIN_BIN}:${PATH}"

        echo "========================================"
        echo "LLVM TOOLCHAIN"
        echo "========================================"

        echo "Clang:"
        command -v clang
        clang --version | head -n 1

        echo
        echo "LLD:"
        command -v ld.lld
        ld.lld --version | head -n 1

        echo
        echo "LLVM tools:"

        for tool in \
          llvm-ar \
          llvm-nm \
          llvm-objcopy \
          llvm-objdump \
          llvm-strip \
          llvm-readelf
        do
          if ! command -v "${tool}" >/dev/null 2>&1; then
            echo "::error::Missing ${tool}"
            exit 1
          fi

          echo "  ${tool}: $(command -v "${tool}")"
        done

        echo
        echo "LLVM toolchain ready."
