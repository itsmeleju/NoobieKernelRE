name: Setup Build Environment
description: Setup dependencies and ZyCromerZ LLVM toolchain

runs:
  using: composite

  steps:
    - name: Install Build Dependencies
      shell: bash
      run: |
        set -e

        sudo apt-get update

        sudo apt-get install -y --no-install-recommends \
          bc \
          bison \
          build-essential \
          flex \
          git \
          libelf-dev \
          liblz4-tool \
          libncurses-dev \
          libssl-dev \
          python3 \
          python-is-python3 \
          unzip \
          u-boot-tools \
          wget \
          curl \
          zip

    - name: Cache ZyCromerZ Clang
      id: clang-cache
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/toolchain
        key: zycromerz-clang-15-v1

    - name: Download ZyCromerZ Clang 15
      shell: bash
      run: |
        set -e

        TOOLCHAIN="${GITHUB_WORKSPACE}/toolchain"

        # Force download if binary doesn't exist (handles empty cache hits)
        if [ ! -f "${TOOLCHAIN}/bin/clang" ]; then
          echo "Clang not found in toolchain cache. Downloading ZyCromerZ Clang 15..."
          rm -rf "${TOOLCHAIN}"
          mkdir -p "${TOOLCHAIN}"

          URL="https://github.com/ZyCromerZ/Clang/releases/download/15.0.7-20260801-release/Clang-15.0.7-20260801.tar.gz"
          ARCHIVE="${RUNNER_TEMP}/clang15.tar.gz"

          curl -sSL --retry 3 --output "${ARCHIVE}" "${URL}"

          echo "Extracting toolchain..."
          tar -xf "${ARCHIVE}" -C "${TOOLCHAIN}" --strip-components=1 || tar -xf "${ARCHIVE}" -C "${TOOLCHAIN}"
          rm -f "${ARCHIVE}"
        else
          echo "Clang 15 successfully restored from cache."
        fi

    - name: Configure LLVM
      shell: bash
      run: |
        set -e

        TOOLCHAIN="${GITHUB_WORKSPACE}/toolchain"

        CLANG="$(find "${TOOLCHAIN}" -type f -name 'clang' | head -n 1)"

        if [ -z "${CLANG}" ]; then
          echo "ERROR: clang not found in toolchain."
          ls -la "${TOOLCHAIN}"
          exit 1
        fi

        BIN_DIR="$(dirname "${CLANG}")"

        echo "${BIN_DIR}" >> "${GITHUB_PATH}"

        {
          echo "ARCH=arm64"
          echo "SUBARCH=arm64"
          echo "LLVM=1"
          echo "LLVM_IAS=1"
          echo "CC=clang"
          echo "LD=ld.lld"
          echo "AR=llvm-ar"
          echo "NM=llvm-nm"
          echo "OBJCOPY=llvm-objcopy"
          echo "OBJDUMP=llvm-objdump"
          echo "STRIP=llvm-strip"
          echo "READELF=llvm-readelf"
          echo "TOOLCHAIN_BIN=${BIN_DIR}"
        } >> "${GITHUB_ENV}"

    - name: Verify Toolchain
      shell: bash
      run: |
        set -e

        CLANG_PATH="$(find "${GITHUB_WORKSPACE}/toolchain" -type f -name 'clang' | head -n 1)"
        BIN_DIR="$(dirname "${CLANG_PATH}")"
        export PATH="${BIN_DIR}:${PATH}"

        echo "Clang:"
        clang --version | head -n 1

        echo "LLD:"
        ld.lld --version | head -n 1

        for tool in \
          llvm-ar \
          llvm-nm \
          llvm-objcopy \
          llvm-objdump \
          llvm-strip
        do
          command -v "${tool}" >/dev/null || {
            echo "ERROR: Missing ${tool}"
            exit 1
          }
        done

        echo "LLVM toolchain ready."
