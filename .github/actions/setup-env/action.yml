name: Setup kernel build environment
description: Install host packages, restore/download ZyCromerZ LLVM/Clang, verify toolchain, and publish build metadata.

inputs:
  llvm-version:
    description: ZyCromerZ LLVM/Clang release version.
    required: false
    default: 15.0.7-20260801

  install-packages:
    description: Install packages required by the legacy Android kernel build.
    required: false
    default: true

outputs:
  llvm-path:
    description: Absolute path to the LLVM bin directory.
    value: ${{ steps.toolchain.outputs.llvm_path }}

  clang-version:
    description: Verified clang version string.
    value: ${{ steps.toolchain.outputs.clang_version }}

  host-metadata:
    description: Host metadata collected during setup.
    value: ${{ steps.metadata.outputs.metadata }}

runs:
  using: composite

  steps:

    - name: Read setup manifest
      id: manifest
      shell: bash
      run: |
        set -euo pipefail

        MANIFEST="$GITHUB_ACTION_PATH/setup.yml"

        test -f "$MANIFEST" || {
          echo "::error::Missing setup manifest: $MANIFEST"
          exit 1
        }

        get_value() {
          local key="$1"
          awk -F': ' -v k="$key" '$1 == k {
            gsub(/^"|"$/, "", $2)
            print $2
            exit
          }' "$MANIFEST"
        }

        LLVM_VERSION="${{ inputs.llvm-version }}"

        LLVM_ARCHIVE="$(get_value llvm_archive)"
        LLVM_URL="$(get_value llvm_url)"
        CACHE_ROOT="$HOME/$(get_value cache_subdir)"

        test -n "$LLVM_ARCHIVE"
        test -n "$LLVM_URL"

        echo "llvm_version=$LLVM_VERSION" >> "$GITHUB_OUTPUT"
        echo "llvm_archive=$LLVM_ARCHIVE" >> "$GITHUB_OUTPUT"
        echo "llvm_url=$LLVM_URL" >> "$GITHUB_OUTPUT"
        echo "cache_root=$CACHE_ROOT" >> "$GITHUB_OUTPUT"

    - name: Install host packages
      if: inputs.install-packages == 'true'
      shell: bash
      run: |
        set -euo pipefail

        export DEBIAN_FRONTEND=noninteractive

        sudo apt-get update

        sudo apt-get install -y --no-install-recommends \
          bc \
          bison \
          build-essential \
          ccache \
          cpio \
          curl \
          file \
          flex \
          git \
          jq \
          libelf-dev \
          libssl-dev \
          libncurses-dev \
          make \
          openssl \
          python3 \
          rsync \
          tar \
          unzip \
          wget \
          xz-utils \
          zip \
          zstd \
          gcc-aarch64-linux-gnu \
          gcc-arm-linux-gnueabi \
          binutils-aarch64-linux-gnu \
          binutils-arm-linux-gnueabi

    - name: Cache ZyCromerZ LLVM
      id: llvm-cache
      uses: actions/cache@v6
      with:
        path: ~/.cache/noobie-kernel-toolchains/llvm-${{ steps.manifest.outputs.llvm_version }}
        key: ${{ runner.os }}-zyclang-${{ steps.manifest.outputs.llvm_version }}-x86_64
        restore-keys: |
          ${{ runner.os }}-zyclang-${{ steps.manifest.outputs.llvm_version }}-
          
    - name: Download and install ZyCromerZ Clang
      if: steps.llvm-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail

        VERSION="${{ steps.manifest.outputs.llvm_version }}"
        ARCHIVE="${{ steps.manifest.outputs.llvm_archive }}"
        URL="${{ steps.manifest.outputs.llvm_url }}"
        CACHE_ROOT="${{ steps.manifest.outputs.cache_root }}"

        PREFIX="$CACHE_ROOT/llvm-$VERSION"
        TMP="$RUNNER_TEMP/zyc-clang-$VERSION"
        FILE="$TMP/$ARCHIVE"

        rm -rf "$TMP" "$PREFIX"
        mkdir -p "$TMP" "$PREFIX"

        echo "Downloading ZyCromerZ Clang:"
        echo "$URL"

        curl -fL \
          --retry 5 \
          --retry-all-errors \
          --connect-timeout 30 \
          --max-time 1800 \
          -o "$FILE" \
          "$URL"

        test -s "$FILE"

        echo
        echo "Downloaded archive:"
        ls -lh "$FILE"

        echo
        echo "Checking gzip archive..."
        gzip -t "$FILE"

        echo "Archive integrity: OK"

        echo
        echo "Reading archive contents..."

        CONTENTS="$TMP/contents.txt"
        tar -tzf "$FILE" > "$CONTENTS"

        echo "First archive entries:"
        sed -n '1,30p' "$CONTENTS"

        echo
        echo "Extracting ZyCromerZ Clang..."

        tar -xzf "$FILE" -C "$PREFIX"

        echo
        echo "Searching for Clang..."

        CLANG="$(find "$PREFIX" -type f -name clang -perm -111 | head -n 1 || true)"

        if [[ -z "$CLANG" ]]; then
          echo "::error::clang was not found in ZyCromerZ archive."

          echo
          echo "Directories:"
          find "$PREFIX" -maxdepth 3 -type d | sed -n '1,100p'

          echo
          echo "LLVM-related files:"
          find "$PREFIX" -type f \( \
            -name clang \
            -o -name clang++ \
            -o -name ld.lld \
            -o -name llvm-ar \
          \) | sed -n '1,100p'

          exit 1
        fi

        LLVM_BIN="$(dirname "$CLANG")"

        echo "Found Clang:"
        echo "$CLANG"

        echo
        echo "LLVM bin directory:"
        echo "$LLVM_BIN"

        if [[ "$LLVM_BIN" != "$PREFIX/bin" ]]; then
          echo
          echo "Normalizing LLVM directory..."

          mkdir -p "$PREFIX/bin"

          for tool in \
            clang \
            clang++ \
            ld.lld \
            llvm-ar \
            llvm-nm \
            llvm-objcopy \
            llvm-objdump \
            llvm-readelf \
            llvm-strip
          do
            SOURCE="$LLVM_BIN/$tool"

            if [[ -e "$SOURCE" ]]; then
              cp -a "$SOURCE" "$PREFIX/bin/"
            fi
          done
        fi

        echo
        echo "Verifying required LLVM tools..."

        for tool in \
          clang \
          clang++ \
          ld.lld \
          llvm-ar \
          llvm-nm \
          llvm-objcopy \
          llvm-objdump \
          llvm-readelf \
          llvm-strip
        do
          if [[ ! -x "$PREFIX/bin/$tool" ]]; then
            echo "::error::Missing tool: $PREFIX/bin/$tool"
            exit 1
          fi
        done

        echo
        echo "=== ZyCromerZ Clang ==="
        "$PREFIX/bin/clang" --version | head -n 2

        echo
        "$PREFIX/bin/ld.lld" --version | head -n 1

        echo
        echo "Installed at:"
        echo "$PREFIX"

        rm -rf "$TMP"

    - name: Put ZyCromerZ LLVM first in PATH
      id: toolchain
      shell: bash
      run: |
        set -euo pipefail

        LLVM_PATH="${{ steps.manifest.outputs.cache_root }}/llvm-${{ steps.manifest.outputs.llvm_version }}/bin"

        test -x "$LLVM_PATH/clang" || {
          echo "::error::clang not found: $LLVM_PATH/clang"
          exit 1
        }

        test -x "$LLVM_PATH/ld.lld" || {
          echo "::error::ld.lld not found: $LLVM_PATH/ld.lld"
          exit 1
        }

        echo "$LLVM_PATH" >> "$GITHUB_PATH"

        echo "LLVM_PATH=$LLVM_PATH" >> "$GITHUB_ENV"

        echo "LLVM_BIN=$LLVM_PATH" >> "$GITHUB_ENV"

        echo "LLVM=$LLVM_PATH/" >> "$GITHUB_ENV"

        CLANG_VERSION="$("$LLVM_PATH/clang" --version | head -n1)"

        echo "llvm_path=$LLVM_PATH" >> "$GITHUB_OUTPUT"
        echo "clang_version=$CLANG_VERSION" >> "$GITHUB_OUTPUT"

        echo "========================================"
        echo "ZyCromerZ LLVM toolchain"
        echo "========================================"
        echo "Path:"
        echo "$LLVM_PATH"
        echo
        echo "Clang:"
        "$LLVM_PATH/clang" --version | head -n3
        echo
        echo "LLD:"
        "$LLVM_PATH/ld.lld" --version | head -n2
        echo
        echo "LLVM AR:"
        "$LLVM_PATH/llvm-ar" --version | head -n2
        echo
        echo "LLVM Objcopy:"
        "$LLVM_PATH/llvm-objcopy" --version | head -n2

    - name: Verify required tools
      shell: bash
      run: |
        set -euo pipefail

        LLVM_PATH="${LLVM_BIN}"

        required_llvm=(
          clang
          clang++
          ld.lld
          llvm-ar
          llvm-nm
          llvm-objcopy
          llvm-readelf
          llvm-strip
        )

        for tool in "${required_llvm[@]}"; do
          test -x "$LLVM_PATH/$tool" || {
            echo "::error::Missing LLVM tool: $LLVM_PATH/$tool"
            exit 1
          }
        done

        required_host=(
          make
          bc
          bison
          flex
          zip
          unzip
          tar
          cpio
          python3
          aarch64-linux-gnu-gcc
          aarch64-linux-gnu-ld
          aarch64-linux-gnu-as
          aarch64-linux-gnu-ar
          arm-linux-gnueabi-gcc
          arm-linux-gnueabi-ld
          arm-linux-gnueabi-as
          arm-linux-gnueabi-ar
        )

        for tool in "${required_host[@]}"; do
          command -v "$tool" >/dev/null 2>&1 || {
            echo "::error::Required host tool is missing: $tool"
            exit 1
          }
        done

        echo
        echo "========================================"
        echo "Verified toolchain"
        echo "========================================"

        echo "clang:"
        command -v clang
        clang --version | head -n3

        echo
        echo "ld.lld:"
        command -v ld.lld
        ld.lld --version | head -n2

        echo
        echo "llvm-ar:"
        command -v llvm-ar

        echo
        echo "aarch64 GNU tools:"
        command -v aarch64-linux-gnu-gcc
        command -v aarch64-linux-gnu-ld

        echo
        echo "arm GNU tools:"
        command -v arm-linux-gnueabi-gcc
        command -v arm-linux-gnueabi-ld

    - name: Verify ZyCromerZ target support
      shell: bash
      run: |
        set -euo pipefail

        echo "=== LLVM target verification ==="

        clang \
          --target=aarch64-linux-gnu \
          -dM \
          -E \
          -x c \
          /dev/null |
          grep -E '__aarch64__' || {
            echo "::error::Clang failed AArch64 target verification"
            exit 1
          }

        echo "AArch64 target: OK"

        echo
        echo "=== Actual binaries ==="

        echo "clang -> $(readlink -f "$(command -v clang)")"
        echo "ld.lld -> $(readlink -f "$(command -v ld.lld)")"
        echo "llvm-ar -> $(readlink -f "$(command -v llvm-ar)")"

    - name: Collect host metadata
      id: metadata
      shell: bash
      run: |
        set -euo pipefail

        OS_NAME="$(
          . /etc/os-release
          echo "$PRETTY_NAME"
        )"

        RAM_MB="$(
          awk '/MemTotal/ {
            print int($2 / 1024)
          }' /proc/meminfo
        )"

        CLANG_VERSION="$(
          clang --version | head -n1
        )"

        META="OS=$OS_NAME; Runner=$(uname -a); CPU=$(nproc); RAM_MB=$RAM_MB; Clang=$CLANG_VERSION"

        echo "metadata=$META" >> "$GITHUB_OUTPUT"

        {
          echo "### Build host"
          echo
          echo "- OS: $OS_NAME"
          echo "- Kernel: $(uname -r)"
          echo "- CPU threads: $(nproc)"
          echo "- RAM: ${RAM_MB} MB"
          echo "- Clang: $CLANG_VERSION"
          echo "- LLVM path: $LLVM_BIN"
          echo "- LLVM source: ZyCromerZ"
          echo "- LLVM release: ${{ steps.manifest.outputs.llvm_version }}"
        } >> "$GITHUB_STEP_SUMMARY"
