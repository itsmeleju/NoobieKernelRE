name: "Setup and Integrate ReSukiSU"
description: "Pulls ReSukiSU, inspects hooks, verifies versions, and configures defconfig"

inputs:
  kernel-dir:
    description: "Path to kernel directory"
    required: false
    default: "."
  defconfig-path:
    description: "Path to target defconfig relative to kernel-dir (e.g. arch/arm64/configs/a32_defconfig)"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Integrate ReSukiSU
      shell: bash
      run: |
        set -e
        cd "${{ inputs.kernel-dir }}"

        echo "=========================================="
        echo "   Starting ReSukiSU Integration Pipeline "
        echo "=========================================="

        # 1. Pull ReSukiSU into kernel source tree
        echo "[*] Downloading and executing ReSukiSU setup script..."
        curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash -s main

        if [ ! -d "drivers/kernelsu" ]; then
          echo "[!] Error: drivers/kernelsu directory not found after running setup.sh!"
          exit 1
        fi

        # 2. Version & Git Commit Check
        echo "[*] Checking ReSukiSU version..."
        if [ -d "drivers/kernelsu/.git" ]; then
          pushd drivers/kernelsu > /dev/null
          RESUKISU_COMMIT=$(git rev-parse --short HEAD 2>/dev/null || echo "Unknown")
          RESUKISU_BRANCH=$(git rev-parse --abbrev-ref HEAD 2>/dev/null || echo "Unknown")
          echo "[✓] ReSukiSU Branch: ${RESUKISU_BRANCH}"
          echo "[✓] ReSukiSU Commit: ${RESUKISU_COMMIT}"
          popd > /dev/null
        else
          echo "[i] ReSukiSU installed as a static directory."
        fi

        # 3. Manual Hook Verification
        echo "[*] Validating manual hooks in kernel source..."
        HOOKS_FOUND=0

        for file in "fs/exec.c" "fs/open.c" "fs/read_write.c"; do
          if [ -f "$file" ] && grep -q "ksu" "$file"; then
            echo "[✓] Manual hook found in $file"
            HOOKS_FOUND=$((HOOKS_FOUND + 1))
          else
            echo "[!] Warning: No 'ksu' mention detected in $file"
          fi
        done

        echo "[*] Total manual hook checkpoints matched: ${HOOKS_FOUND}/3"

        # 4. Enable Kconfig & Makefile bindings
        echo "[*] Verifying drivers/Makefile and drivers/Kconfig bindings..."
        if ! grep -q "kernelsu" drivers/Makefile; then
          echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
        else
          sed -i 's|^# *obj-$(CONFIG_KSU) *+= *kernelsu/|obj-$(CONFIG_KSU) += kernelsu/|g' drivers/Makefile
        fi

        if ! grep -q "kernelsu/Kconfig" drivers/Kconfig; then
          echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig
        else
          sed -i 's|^# *source "drivers/kernelsu/Kconfig"|source "drivers/kernelsu/Kconfig"|g' drivers/Kconfig
        fi

        # 5. Resolve Defconfig Path
        DEFCONFIG_FILE="${{ inputs.defconfig-path }}"

        if [ -z "$DEFCONFIG_FILE" ]; then
          echo "[i] No explicit defconfig provided. Searching arch/arm64/configs/..."
          DEFCONFIG_FILE=$(find arch/arm64/configs/ -type f \( -name "*defconfig*" -o -name "*_config" \) | head -n 1)
        fi

        if [ -n "$DEFCONFIG_FILE" ] && [ -f "$DEFCONFIG_FILE" ]; then
          echo "[*] Appending manual hook configurations to $DEFCONFIG_FILE..."
          sed -i '/CONFIG_KSU/d' "$DEFCONFIG_FILE"
          printf "\n# ReSukiSU Manual Hook Configs\nCONFIG_KSU=y\nCONFIG_KSU_MANUAL_HOOK=y\n" >> "$DEFCONFIG_FILE"
          echo "[✓] Defconfig updated successfully at $DEFCONFIG_FILE."
        else
          echo "[!] Error: Target defconfig file could not be resolved!"
          exit 1
        fi

        echo "=========================================="
        echo "   ReSukiSU Setup Completed Successfully  "
        echo "=========================================="
