name: Build NoobieKernelRE by NoobieThingZ

on:
  workflow_dispatch:
    inputs:
      ksu_option:
        description: "KernelSU / ReSukiSU setup"
        required: true
        default: "enabled"
        type: choice
        options:
          - disabled
          - enabled

      nomount_option:
        description: "No-mount setup"
        required: false
        default: "disabled"
        type: choice
        options:
          - disabled
          - enabled

      localversion:
        description: "Kernel localversion"
        required: false
        default: "-ver1.03-GA"
        type: string

jobs:
  build:
    name: A32 Kernel
    runs-on: ubuntu-latest

    env:
      ARCH: arm64
      SUBARCH: arm64
      OUT_DIR: ${{ github.workspace }}/out
      BUILD_JOBS: 4

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Setup Build Environment
        uses: ./.github/actions/setup-env

      - name: Setup ReSukiSU
        if: inputs.ksu_option == 'enabled'
        uses: ./.github/actions/resuki
        with:
          defconfig-path: arch/arm64/configs/Noobie_SU_defconfig

      - name: Setup NoMount
        if: inputs.nomount_option == 'enabled'
        uses: ./.github/actions/no-mount

      - name: Configure
        shell: bash
        run: |
          set -e

          rm -rf "${OUT_DIR}"
          mkdir -p "${OUT_DIR}"

          make \
            O="${OUT_DIR}" \
            ARCH="${ARCH}" \
            LLVM=1 \
            LLVM_IAS=1 \
            Noobie_SU_defconfig

          scripts/config \
            --file "${OUT_DIR}/.config" \
            --set-str CONFIG_LOCALVERSION "${{ inputs.localversion }}"

      - name: Build
        shell: bash
        run: |
          set -o pipefail

          LOG="${RUNNER_TEMP}/kernel-build.log"

          make \
            -C "${GITHUB_WORKSPACE}" \
            O="${OUT_DIR}" \
            ARCH="${ARCH}" \
            LLVM=1 \
            LLVM_IAS=1 \
            -j"${BUILD_JOBS}" \
            KCFLAGS="-pipe -O2" \
            CONFIG_SECTION_MISMATCH_WARN_ONLY=y \
            2>&1 | tee "${LOG}"

          status=${PIPESTATUS[0]}

          if [ "${status}" -ne 0 ]; then
            echo "Kernel build failed."
            tail -n 100 "${LOG}"
            exit "${status}"
          fi

      - name: Package
        shell: bash
        run: |
          set -e

          IMAGE="${OUT_DIR}/arch/arm64/boot/Image"
          AK_DIR="${GITHUB_WORKSPACE}/AnyKernel"
          STAGE="${RUNNER_TEMP}/AnyKernel"

          test -s "${IMAGE}"
          test -f "${AK_DIR}/anykernel.sh"

          rm -rf "${STAGE}"
          mkdir -p "${STAGE}"

          cp -a "${AK_DIR}/." "${STAGE}/"
          rm -f \
            "${STAGE}/Image" \
            "${STAGE}/Image.gz" \
            "${STAGE}/Image.gz-dtb" \
            "${STAGE}/dtbo.img"

          cp "${IMAGE}" "${STAGE}/Image"

          DATE="$(date -u +%Y%m%d-%H%M)"
          SHA="$(git rev-parse --short=8 HEAD)"
          ZIP_NAME="NoobieKernelRE-A32-${DATE}-${SHA}.zip"
          ZIP_PATH="${GITHUB_WORKSPACE}/${ZIP_NAME}"

          (
            cd "${STAGE}"
            zip -r9 "${ZIP_PATH}" . \
              -x ".git/*" \
              -x ".github/*" \
              -x "README.md"
          )

          test -s "${ZIP_PATH}"

          unzip -p "${ZIP_PATH}" Image | cmp - "${IMAGE}"

          sha256sum "${IMAGE}" "${ZIP_PATH}" \
            > "${GITHUB_WORKSPACE}/SHA256SUMS.txt"

          echo "ZIP_PATH=${ZIP_PATH}" >> "${GITHUB_ENV}"
          echo "SHA_FILE=${GITHUB_WORKSPACE}/SHA256SUMS.txt" >> "${GITHUB_ENV}"

      - name: Upload Kernel
        uses: actions/upload-artifact@v4
        with:
          name: NoobieKernelRE-A32-${{ github.run_number }}
          path: ${{ env.ZIP_PATH }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload SHA256
        uses: actions/upload-artifact@v4
        with:
          name: NoobieKernelRE-SHA256-${{ github.run_number }}
          path: ${{ env.SHA_FILE }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NoobieKernelRE-BuildLog-${{ github.run_number }}
          path: ${{ runner.temp }}/kernel-build.log
          if-no-files-found: ignore
          retention-days: 7
