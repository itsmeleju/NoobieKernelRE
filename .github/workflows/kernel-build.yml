name: NoobieKernelRE Builder

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: Kernel defconfig
        required: true
        default: Noobie_SU_defconfig
        type: string

      resukisu:
        description: Enable ReSukiSU
        required: true
        default: enabled
        type: choice
        options:
          - enabled
          - disabled

      gpu_driver:
        description: GPU driver
        required: true
        default: r25p
        type: choice
        options:
          - r25p
          - r32p

      enable_nomount:
        description: Enable NoMount
        required: true
        default: false
        type: boolean

      nomount_ref:
        description: NoMount ref
        required: false
        default: v2.0.0
        type: string

      localversion:
        description: Kernel LOCALVERSION
        required: true
        default: -ver.1.03-GA
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Initialize log
        run: |
          : > build.log
          echo "NoobieKernelRE build started"
          echo "Commit: ${GITHUB_SHA}" | tee -a build.log

      - name: Cache Clang
        uses: actions/cache@v4
        with:
          path: clang/
          key: ${{ runner.os }}-noobie-clang-v1

      - name: Setup Clang
        uses: ./.github/actions/setup-clang

      - name: Verify Clang
        run: |
          set -e

          test -n "${CLANG_DIR:-}"
          test -x "${CLANG_DIR}/bin/clang"
          test -x "${CLANG_DIR}/bin/ld.lld"

          export PATH="${CLANG_DIR}/bin:/usr/bin:${PATH}"

          echo "Clang:"
          clang --version | head -n 1

          echo "LLD:"
          ld.lld --version | head -n 1

      - name: Configure kernel
        run: |
          set -e

          export PATH="${CLANG_DIR}/bin:/usr/bin:${PATH}"

          test -f "arch/arm64/configs/${{ inputs.defconfig }}"

          make \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=0 \
            KCFLAGS="-O2 -w" \
            CONFIG_SECTION_MISMATCH_WARN_ONLY=y \
            "${{ inputs.defconfig }}" \
            2>&1 | tee -a build.log

          sed -i '/^CONFIG_LOCALVERSION=/d' out/.config

          printf 'CONFIG_LOCALVERSION="%s"\n' \
            '${{ inputs.localversion }}' >> out/.config

      - name: Configure GPU
        run: |
          set -e

          CONFIG="out/.config"

          sed -i \
            '/^CONFIG_MTK_GPU_MALI_R25P=/d' \
            "$CONFIG"

          sed -i \
            '/^# CONFIG_MTK_GPU_MALI_R25P is not set$/d' \
            "$CONFIG"

          sed -i \
            '/^CONFIG_MTK_GPU_MALI_R32P=/d' \
            "$CONFIG"

          sed -i \
            '/^# CONFIG_MTK_GPU_MALI_R32P is not set$/d' \
            "$CONFIG"

          sed -i \
            '/^CONFIG_MTK_GPU_VERSION=/d' \
            "$CONFIG"

          if [ "${{ inputs.gpu_driver }}" = "r32p" ]; then

            printf '%s\n' \
              '# CONFIG_MTK_GPU_MALI_R25P is not set' \
              'CONFIG_MTK_GPU_MALI_R32P=y' \
              'CONFIG_MTK_GPU_VERSION="mali valhall r32p1"' \
              >> "$CONFIG"

          else

            printf '%s\n' \
              'CONFIG_MTK_GPU_MALI_R25P=y' \
              '# CONFIG_MTK_GPU_MALI_R32P is not set' \
              'CONFIG_MTK_GPU_VERSION="mali bifrost r25p0"' \
              >> "$CONFIG"

          fi

          make O=out ARCH=arm64 olddefconfig \
            2>&1 | tee -a build.log

          echo
          echo "GPU configuration:"
          grep -E \
            'CONFIG_MTK_GPU_MALI_R25P|CONFIG_MTK_GPU_MALI_R32P|CONFIG_MTK_GPU_VERSION' \
            out/.config | tee -a build.log

      - name: Integrate ReSukiSU
        if: ${{ inputs.resukisu == 'enabled' }}
        uses: ./.github/actions/resuki
        with:
          ref: main

      - name: Verify ReSukiSU
        if: ${{ inputs.resukisu == 'enabled' }}
        run: |
          set -e

          test -d KernelSU/kernel
          test -L drivers/kernelsu
          grep -q '^CONFIG_KSU=y' out/.config

          echo "ReSukiSU verified" | tee -a build.log

      - name: Check NoMount
        run: |
          if [ "${{ inputs.enable_nomount }}" = "true" ]; then
            echo "NoMount requested: ${{ inputs.nomount_ref }}" | tee -a build.log
            echo "NoMount integration is not included yet." | tee -a build.log
          else
            echo "NoMount disabled" | tee -a build.log
          fi

      - name: Build kernel
        run: |
          set -o pipefail

          export PATH="${CLANG_DIR}/bin:/usr/bin:${PATH}"

          START=$(date +%s)

          make \
            -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=0 \
            KCFLAGS="-O2 -w" \
            CONFIG_SECTION_MISMATCH_WARN_ONLY=y \
            2>&1 | tee -a build.log

          END=$(date +%s)

          echo "BUILD_DURATION=$((END - START))" >> "$GITHUB_ENV"
          echo "KERNEL_VERSION=$(make O=out ARCH=arm64 kernelversion)" \
            >> "$GITHUB_ENV"

      - name: Verify kernel
        run: |
          set -e

          test -s out/arch/arm64/boot/Image
          test -s out/arch/arm64/boot/dtbo.img

          SHA256=$(sha256sum \
            out/arch/arm64/boot/Image | cut -d' ' -f1)

          echo "IMAGE_SHA256=$SHA256" >> "$GITHUB_ENV"

          echo "Kernel Image verified"
          echo "DTBO verified"
          echo "SHA256: $SHA256" | tee -a build.log

      - name: Prepare AnyKernel3
        run: |
          set -e

          test -d AnyKernel3

          cp \
            out/arch/arm64/boot/Image \
            AnyKernel3/Image

          cp \
            out/arch/arm64/boot/dtbo.img \
            AnyKernel3/dtbo.img

      - name: Create kernel ZIP
        run: |
          set -e

          TIME=$(TZ=Asia/Kolkata date '+%d-%m-%H%M')

          ZIP="NoobieKernlRE_GA-${{ inputs.gpu_driver }}-${TIME}.zip"

          cd AnyKernel3

          zip -r9 "../${ZIP}" . \
            -x '*.git*' \
            -x '*.github*' \
            -x 'README.md' \
            -x '*.zip'

          cd ..

          test -s "${ZIP}"

          SHA256=$(sha256sum "${ZIP}" | cut -d' ' -f1)

          echo "KERNEL_ZIP=${ZIP}" >> "$GITHUB_ENV"
          echo "KERNEL_ZIP_SHA256=${SHA256}" >> "$GITHUB_ENV"

          echo "Kernel ZIP: ${ZIP}" | tee -a build.log
          echo "ZIP SHA256: ${SHA256}" | tee -a build.log

      - name: Build summary
        if: ${{ always() }}
        run: |
          set +e

          grep -nEi \
            'error:|fatal error:|undefined reference|llvm error|make.*\*\*\*' \
            build.log > build-errors.txt || true

          {
            echo "# NoobieKernelRE Build Report"
            echo
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| Status | ${{ job.status }} |"
            echo "| Defconfig | ${{ inputs.defconfig }} |"
            echo "| GPU | ${{ inputs.gpu_driver }} |"
            echo "| ReSukiSU | ${{ inputs.resukisu }} |"
            echo "| NoMount | ${{ inputs.enable_nomount }} |"
            echo "| Kernel | ${KERNEL_VERSION:-unknown} |"
            echo "| Duration | ${BUILD_DURATION:-unknown}s |"
            echo "| ZIP | ${KERNEL_ZIP:-not created} |"
            echo

            echo "## Errors"
            echo

            if [ -s build-errors.txt ]; then
              echo '```text'
              head -50 build-errors.txt
              echo '```'
            else
              echo "No compiler/linker errors detected."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: |
            build.log
            build-errors.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Upload kernel
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: NoobieKernlRE-${{ github.run_number }}
          path: NoobieKernlRE_GA-*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Telegram success
        if: ${{ success() }}
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_MESSAGE_THREAD_ID: ${{ secrets.TELEGRAM_MESSAGE_THREAD_ID }}
        run: |
          bash .github/scripts/telegram-report.sh success \
            "${KERNEL_ZIP:-}" \
            "${KERNEL_VERSION:-unknown}" \
            "${BUILD_DURATION:-unknown}" \
            "${IMAGE_SHA256:-unknown}"

      - name: Telegram failure
        if: ${{ failure() }}
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_MESSAGE_THREAD_ID: ${{ secrets.TELEGRAM_MESSAGE_THREAD_ID }}
        run: |
          bash .github/scripts/telegram-report.sh failure \
            "${KERNEL_ZIP:-}" \
            "${KERNEL_VERSION:-unknown}" \
            "${BUILD_DURATION:-unknown}" \
            "${IMAGE_SHA256:-unknown}"
