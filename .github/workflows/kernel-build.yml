name: NoobieThingZ Kernel Builder

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: Defconfig under arch/arm64/configs/
        required: true
        default: Noobie_SU_defconfig
        type: string
      toolchain:
        description: Clang toolchain
        required: true
        default: ZyCromerZ
        type: choice
        options: [ZyCromerZ, Neutron]
      zip_name:
        description: ZIP name prefix
        required: true
        default: NoobieKernelRE-GA
        type: string
      resukisu:
        description: ReSukiSU / KernelSU integration
        required: true
        default: enabled
        type: choice
        options: [enabled, disabled]
      nomount:
        description: Integrate NoMount
        required: false
        default: false
        type: boolean
      gpu_driver:
        description: Mali GPU driver
        required: true
        default: r25p
        type: choice
        options: [r25p, r32p]
      localversion:
        description: Kernel LOCALVERSION suffix
        required: true
        default: -ver.1.12-GA
        type: string
      version_clang:
        description: Exact Clang release/tag (empty = action default)
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: kernel-build-${{ github.ref }}
  cancel-in-progress: false

env:
  OUT: out
  ARCH: arm64
  SUBARCH: arm64
  CROSS_COMPILE: aarch64-linux-gnu-   # GNU as/ld prefix (LLVM_IAS=0); binutils installed in step 2
  LLVM: "1"
  LLVM_IAS: "0"
  KCFLAGS: "-w -pipe -O2 -Wno-error"
  CONFIG_SECTION_MISMATCH_WARN_ONLY: "y"
  TZ: Asia/Kolkata
  # Inputs are passed through env (never inline in scripts) to avoid shell injection
  DEFCONFIG: ${{ inputs.defconfig }}
  GPU: ${{ inputs.gpu_driver }}
  LOCALVERSION: ${{ inputs.localversion }}
  RESUKISU: ${{ inputs.resukisu }}
  ZIP_PREFIX: ${{ inputs.zip_name }}

defaults:
  run:
    shell: bash   # bash -eo pipefail: a failing "make | tee" fails the step

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: "[1/9] Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: "[2/9] Host tools"
        run: |
          test -f "arch/arm64/configs/$DEFCONFIG" || { echo "::error::Defconfig not found: $DEFCONFIG"; exit 1; }
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            bc bison flex libssl-dev libelf-dev cpio lz4 rsync zip unzip \
            device-tree-compiler xz-utils binutils-aarch64-linux-gnu

      - name: "[3/9] Toolchain"
        id: toolchain
        uses: ./.github/actions/setup-clang
        with:
          toolchain: ${{ inputs.toolchain }}
          version_clang: ${{ inputs.version_clang }}

      - name: "[4/9] ReSukiSU"
        if: ${{ inputs.resukisu == 'enabled' }}
        uses: ./.github/actions/resuki

      - name: "[4/9] ReSukiSU disabled (Kconfig stub)"
        if: ${{ inputs.resukisu != 'enabled' }}
        run: |
          rm -rf ReSukiSU KernelSU drivers/kernelsu
          mkdir -p drivers/kernelsu
          touch drivers/kernelsu/Kconfig
          echo 'obj-y :=' > drivers/kernelsu/Makefile

      - name: "[5/9] NoMount"
        if: ${{ inputs.nomount }}
        uses: ./.github/actions/nomount

      - name: "[6/9] Configure and verify .config"
        run: |
          rm -rf "$OUT"
          make O="$OUT" ARCH="$ARCH" LLVM="$LLVM" LLVM_IAS="$LLVM_IAS" CROSS_COMPILE="$CROSS_COMPILE" "$DEFCONFIG"

          cfg() { scripts/config --file "$OUT/.config" "$@"; }

          case "$GPU" in
            r32p) cfg -d CONFIG_MTK_GPU_MALI_R25P -e CONFIG_MTK_GPU_MALI_R32P --set-str CONFIG_MTK_GPU_VERSION "mali valhall r32p1" ;;
            r25p) cfg -e CONFIG_MTK_GPU_MALI_R25P -d CONFIG_MTK_GPU_MALI_R32P --set-str CONFIG_MTK_GPU_VERSION "mali bifrost r25p0" ;;
            *) echo "::error::Invalid GPU driver: $GPU"; exit 1 ;;
          esac

          cfg --set-str CONFIG_LOCALVERSION "$LOCALVERSION"
          if [ "$RESUKISU" = enabled ]; then
            cfg -e CONFIG_KSU -e CONFIG_KSU_MANUAL_HOOK   # manual hook symbol is dropped by olddefconfig if the tree lacks it
          fi

          # Resolve dependencies after the manual edits
          make O="$OUT" ARCH="$ARCH" LLVM="$LLVM" LLVM_IAS="$LLVM_IAS" CROSS_COMPILE="$CROSS_COMPILE" olddefconfig

          want() {
            grep -qxF "$1" "$OUT/.config" || { echo "::error::Missing in final .config: $1"; exit 1; }
            echo "[OK] $1"
          }
          want CONFIG_ARM64=y
          want "CONFIG_LOCALVERSION=\"$LOCALVERSION\""
          gpu_sym=CONFIG_MTK_GPU_MALI_R25P
          if [ "$GPU" = r32p ]; then gpu_sym=CONFIG_MTK_GPU_MALI_R32P; fi
          if grep -qE "^${gpu_sym}=[ym]$" "$OUT/.config"; then
            echo "[OK] $gpu_sym"
          else
            echo "::error::$gpu_sym is not enabled in the final .config"
            echo "--- Kconfig definitions of the symbol:"
            grep -rn --include='Kconfig*' "${gpu_sym#CONFIG_}" drivers arch || echo "(none: symbol is not defined in this tree)"
            echo "--- MTK_GPU lines in final .config:"
            grep -n 'MTK_GPU' "$OUT/.config" || echo "(none)"
            exit 1
          fi
          if [ "$RESUKISU" = enabled ]; then want CONFIG_KSU=y; fi

      - name: "[7/9] Build"
        id: build
        run: |
          make -j"$(nproc)" O="$OUT" ARCH="$ARCH" SUBARCH="$SUBARCH" LLVM="$LLVM" LLVM_IAS="$LLVM_IAS" \
            CROSS_COMPILE="$CROSS_COMPILE" KCFLAGS="$KCFLAGS" \
            CONFIG_SECTION_MISMATCH_WARN_ONLY="$CONFIG_SECTION_MISMATCH_WARN_ONLY" \
            2>&1 | tee build.log

      - name: "[8/9] Build error summary"
        if: ${{ failure() && steps.build.outcome == 'failure' }}
        run: |
          {
            echo "Build failed | $(git rev-parse --short HEAD) | $DEFCONFIG | ${{ inputs.toolchain }} | GPU $GPU"
            echo
            line="$(grep -n -m1 -E 'error:|undefined reference|No rule to make target' build.log | cut -d: -f1 || true)"
            if [ -n "$line" ]; then
              sed -n "$((line > 8 ? line - 8 : 1)),$((line + 8))p" build.log
            else
              tail -n 60 build.log
            fi
          } | tee build-error.txt

      - name: "[9/9] Package AnyKernel3 and verify ZIP"
        if: ${{ success() }}
        run: |
          BOOT="$OUT/arch/arm64/boot"
          test -s "$BOOT/Image" || { echo "::error::Image missing"; exit 1; }
          test -s "$BOOT/dts/mediatek/mt6768.dtb" || { echo "::error::mt6768.dtb missing"; exit 1; }
          test -f AnyKernel3/anykernel.sh || { echo "::error::AnyKernel3/anykernel.sh missing"; exit 1; }

          PKG="$RUNNER_TEMP/ak3"
          rm -rf "$PKG"
          rsync -a --exclude='.git' AnyKernel3/ "$PKG/"
          cp "$BOOT/Image" "$PKG/"
          cp "$BOOT"/dts/mediatek/*.dtb "$PKG/"

          safe="$(printf '%s' "$ZIP_PREFIX" | tr -cd '[:alnum:]_.-')"
          ZIP_NAME="${safe:-Kernel}-${GPU}-$(date +%Y%m%d-%H%M).zip"
          ZIP_PATH="$RUNNER_TEMP/$ZIP_NAME"
          (cd "$PKG" && zip -r9 -q "$ZIP_PATH" . -x '.git/*' 'README.md' '*placeholder*')

          unzip -l "$ZIP_PATH" | grep -Eq '[[:space:]]Image$' || { echo "::error::Image not in ZIP"; exit 1; }
          unzip -l "$ZIP_PATH" | grep -Eq '[[:space:]]mt6768\.dtb$' || { echo "::error::mt6768.dtb not in ZIP"; exit 1; }
          ls -lh "$ZIP_PATH"

          echo "ZIP_NAME=$ZIP_NAME" >> "$GITHUB_ENV"
          echo "ZIP_PATH=$ZIP_PATH" >> "$GITHUB_ENV"

      - name: Upload ZIP
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_PATH }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build.log
            build-error.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Telegram report
        if: ${{ !cancelled() }}
        continue-on-error: true
        # Add `env:` with your Telegram secrets here if the script reads them from the environment
        run: |
          chmod +x .github/scripts/telegram-report.sh
          .github/scripts/telegram-report.sh "${{ job.status }}" \
            "${{ inputs.toolchain }}" \
            "${{ steps.toolchain.outputs.version }}" \
            "${{ inputs.gpu_driver }}" \
            "${{ inputs.resukisu }}" \
            "${{ inputs.nomount }}" \
            "${ZIP_NAME:-}" \
            "${ZIP_PATH:-}"
