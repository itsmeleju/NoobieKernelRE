name: NoobieThingZ Kernel Builder v3

on:
  workflow_dispatch:
    inputs:
      toolchain_link:
        description: "Clang Download Link"
        required: false
        default: "https://github.com/ZyCromerZ/Clang/releases/download/14.0.6-20260619-release/Clang-14.0.6-20260619.tar.gz"
      defconfig:
        description: "Kernel defconfig name"
        required: true
        default: "Noobie_SU_defconfig"
      gpu_driver:
        description: "GPU driver version"
        required: true
        default: "r25p"
        type: choice
        options:
          - r25p
          - r32p
      resukisu:
        description: "ReSukiSU / KernelSU integration"
        required: true
        default: "enabled"
        type: choice
        options:
          - enabled
          - disabled
      localversion:
        description: "CONFIG_LOCALVERSION value"
        required: false
        default: "-ver.1.8-GA"

env:
  # ── Global Editable Build Configuration ─────────────────────────────────────
  TOOLCHAIN_LINK: "${{ github.event.inputs.toolchain_link || 'https://github.com/ZyCromerZ/Clang/releases/download/14.0.6-20260619-release/Clang-14.0.6-20260619.tar.gz' }}"
  DEFCONFIG: "${{ github.event.inputs.defconfig || 'Noobie_SU_defconfig' }}"
  GPU_DRIVER: "${{ github.event.inputs.gpu_driver || 'r25p' }}"
  RESUKISU: "${{ github.event.inputs.resukisu || 'enabled' }}"
  CONFIG_LOCALVERSION: "${{ github.event.inputs.localversion || '-ver.1.8-GA' }}"
  ARCH: arm64
  SUBARCH: arm64

jobs:
  build-kernel:
    runs-on: ubuntu-22.04

    steps:
      # ── Step 1: Checkout Source Code ────────────────────────────────────────
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      # ── Step 2: Workspace & Submodule Conflict Verification ─────────────────
      - name: Verify Workspace & Check Submodules
        run: |
          echo "::group::Workspace Integrity Check"
          CONFLICT_DETECTED=0

          echo "[*] Checking workspace root: $GITHUB_WORKSPACE"

          # Verify AnyKernel3 directory state
          if [ -d "AnyKernel3" ]; then
            echo "[✓] Existing AnyKernel3 directory detected. Preserving workspace copy."
            if [ -d "AnyKernel3/.git" ]; then
              echo "[*] AnyKernel3 is tracked as a Git submodule/repository."
            else
              echo "[*] AnyKernel3 is a local directory."
            fi
          else
            echo "[!] AnyKernel3 directory not found in root. It will be cloned during packaging."
          fi

          # Check for conflicting unmerged Git states or submodules
          if git status --porcelain | grep -q '^UU'; then
            echo "::error::Git merge conflict markers detected in repository!"
            CONFLICT_DETECTED=1
          fi

          if [ "$CONFLICT_DETECTED" -ne 0 ]; then
            echo "::error::Workspace conflicts found. Halting build."
            exit 1
          fi

          echo "[✓] Workspace verification complete. No conflicts detected."
          echo "::endgroup::"

      # ── Step 3: Workspace & Cache Cleanup ───────────────────────────────────
      - name: Cleanup Workspace & Stale Files
        run: |
          echo "::group::Cleaning Build Artifacts & Stale Caches"

          # Remove leftover build directory
          if [ -d "out" ]; then
            echo "[*] Purging leftover out/ directory..."
            rm -rf out
          fi

          # Prune files older than 8 days in user cache
          if [ -d "$HOME/.cache" ]; then
            echo "[*] Scanning and pruning files older than 8 days from ~/.cache..."
            find "$HOME/.cache" -type f -mtime +8 -exec rm -vf {} + 2>/dev/null || true
          fi

          echo "::endgroup::"

      # ── Step 4: Toolchain Cache ─────────────────────────────────────────────
      - name: Cache Clang Toolchain
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/clang
          key: clang-tc-${{ runner.os }}-${{ hashFiles('**/kernel-build.yml') }}-${{ env.TOOLCHAIN_LINK }}
          restore-keys: |
            clang-tc-${{ runner.os }}-

      # ── Step 5: Setup Clang and Build Environment ───────────────────────────
      - name: Setup Clang and Build Environment
        id: setup-clang
        uses: ./.github/actions/setup-clang
        with:
          link: ${{ env.TOOLCHAIN_LINK }}
          install-dir: ${{ github.workspace }}/clang
          cache-hit: ${{ steps.cache-toolchain.outputs.cache-hit }}

      # ── Step 6: Execute ReSukiSU Integration ────────────────────────────────
      - name: Execute ReSukiSU Integration
        if: ${{ env.RESUKISU == 'enabled' }}
        run: |
          echo "::group::ReSukiSU / KernelSU Setup"
          if [ -f ".github/actions/resuki/action.yml" ]; then
            echo "[*] Executing ReSukiSU composite action..."
            # Invoked dynamically if required by user sub-action setup
          elif [ -f "drivers/kernelsu" ] || [ -d "KernelSU" ]; then
            echo "[✓] KernelSU tree detected in kernel source."
          else
            echo "[*] ReSukiSU enabled: Kernel configuration flag will be injected into .config."
          fi
          echo "::endgroup::"

      # ── Step 7: Build Kernel ────────────────────────────────────────────────
      - name: Build Kernel
        run: |
          echo "::group::Configuring and Compiling Kernel"

          # Ensure host binaries (/usr/bin) are prioritized for host tools to prevent illegal instruction errors
          export PATH="/usr/bin:${GITHUB_WORKSPACE}/clang/bin:${PATH}"
          TC_DIR="${GITHUB_WORKSPACE}/clang/bin"

          echo "[*] Clang Version:"
          "$TC_DIR/clang" --version | head -n 1

          MAKE_ARGS=(
            O=out
            ARCH=arm64
            SUBARCH=arm64

            # Complete Target Toolchain Tools
            CC="$TC_DIR/clang"
            LD="$TC_DIR/ld.lld"
            AR="$TC_DIR/llvm-ar"
            NM="$TC_DIR/llvm-nm"
            OBJCOPY="$TC_DIR/llvm-objcopy"
            OBJDUMP="$TC_DIR/llvm-objdump"
            STRIP="$TC_DIR/llvm-strip"
            READELF="$TC_DIR/llvm-readelf"
            OBJSIZE="$TC_DIR/llvm-size"
            LLVM_AR="$TC_DIR/llvm-ar"
            LLVM_DIS="$TC_DIR/llvm-dis"

            # Host Tools (Explicitly pointed to system binaries)
            HOSTCC=/usr/bin/gcc
            HOSTCXX=/usr/bin/g++
            HOSTLD=/usr/bin/ld
            HOSTAR=/usr/bin/ar

            # Cross compile prefixes
            CROSS_COMPILE="aarch64-linux-gnu-"
            CROSS_COMPILE_ARM32="arm-linux-gnueabi-"
            CLANG_TRIPLE="aarch64-linux-gnu-"

            # LLVM flags
            LLVM=1
            LLVM_IAS=0

            # Optimizations and Warning Flags
            KCFLAGS="-w -pipe -O2 -Wno-error"
            CONFIG_SECTION_MISMATCH_WARN_ONLY=y
          )

          mkdir -p out

          # ── 7.1 Configure Kernel Defconfig
          echo "[*] Initializing defconfig: ${DEFCONFIG}..."
          make "${MAKE_ARGS[@]}" "${DEFCONFIG}"

          # ── 7.2 Apply CONFIG_LOCALVERSION
          if [ -n "${CONFIG_LOCALVERSION}" ]; then
            echo "[*] Setting CONFIG_LOCALVERSION=\"${CONFIG_LOCALVERSION}\"..."
            sed -i '/CONFIG_LOCALVERSION=/d' out/.config
            echo "CONFIG_LOCALVERSION=\"${CONFIG_LOCALVERSION}\"" >> out/.config
          fi

          # ── 7.3 Apply ReSukiSU / KernelSU Config
          if [ "${RESUKISU}" = "enabled" ]; then
            echo "[*] Enabling CONFIG_KSU..."
            sed -i '/CONFIG_KSU=/d' out/.config
            echo "CONFIG_KSU=y" >> out/.config
          fi

          # ── 7.4 Apply GPU Driver Option
          echo "[*] Setting GPU driver to: ${GPU_DRIVER}..."
          sed -i '/CONFIG_MTK_GPU_MALI_R25P/d' out/.config
          sed -i '/CONFIG_MTK_GPU_MALI_R32P/d' out/.config
          sed -i '/CONFIG_MTK_GPU_VERSION/d' out/.config

          if [ "${GPU_DRIVER}" = "r25p" ]; then
            echo "CONFIG_MTK_GPU_MALI_R25P=y" >> out/.config
            echo "# CONFIG_MTK_GPU_MALI_R32P is not set" >> out/.config
            echo 'CONFIG_MTK_GPU_VERSION="mali bifrost r25p0"' >> out/.config
          elif [ "${GPU_DRIVER}" = "r32p" ]; then
            echo "# CONFIG_MTK_GPU_MALI_R25P is not set" >> out/.config
            echo "CONFIG_MTK_GPU_MALI_R32P=y" >> out/.config
            echo 'CONFIG_MTK_GPU_VERSION="mali valhall r32p1"' >> out/.config
          fi

          # ── 7.5 Resolve Configuration via olddefconfig
          echo "[*] Running olddefconfig to align updated symbols..."
          make "${MAKE_ARGS[@]}" olddefconfig

          # ── 7.6 Compilation Process
          JOBS=$(nproc --all)
          echo "[*] Starting compilation with $JOBS threads..."
          make -j"$JOBS" "${MAKE_ARGS[@]}" 2>&1 | tee build.log

          echo "[*] Build completed. Checking output binaries:"
          ls -lh out/arch/arm64/boot/ || true
          echo "::endgroup::"

      # ── Step 8: Prepare AnyKernel3 Workspace ─────────────────────────────────
      - name: Prepare AnyKernel3 Workspace
        run: |
          echo "::group::Preparing AnyKernel3 Directory"

          if [ ! -d "AnyKernel3" ]; then
            echo "[*] AnyKernel3 directory missing; cloning clean instance..."
            git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          else
            echo "[*] Cleaning existing AnyKernel3 directory of leftover binaries..."
            rm -rf AnyKernel3/Image AnyKernel3/Image.gz AnyKernel3/Image.gz-dtb AnyKernel3/*.dtb AnyKernel3/*.zip AnyKernel3/NoobieKernelRE/
          fi

          # Locate and copy the raw uncompressed kernel Image
          if [ -f "out/arch/arm64/boot/Image" ]; then
            echo "[✓] Copying uncompressed Image..."
            cp out/arch/arm64/boot/Image AnyKernel3/Image
          elif [ -f "out/arch/arm64/boot/Image.gz" ]; then
            echo "[✓] Decompressing Image.gz to raw Image..."
            gzip -dc out/arch/arm64/boot/Image.gz > AnyKernel3/Image
          elif [ -f "out/arch/arm64/boot/Image.gz-dtb" ]; then
            echo "[✓] Decompressing Image.gz-dtb to raw Image..."
            gzip -dc out/arch/arm64/boot/Image.gz-dtb > AnyKernel3/Image
          else
            echo "::error::No valid Image, Image.gz, or Image.gz-dtb produced by compilation!"
            exit 1
          fi

          # Locate and copy DTB / DTBO if present
          if [ -f "out/arch/arm64/boot/dtb" ]; then
            cp out/arch/arm64/boot/dtb AnyKernel3/dtb
          elif [ -f "out/arch/arm64/boot/dts/mediatek/mt6768.dtb" ]; then
            cp out/arch/arm64/boot/dts/mediatek/mt6768.dtb AnyKernel3/dtb
          elif [ -f "mt6768.dtb" ]; then
            cp mt6768.dtb AnyKernel3/dtb
          fi

          echo "::endgroup::"

      # ── Step 9: Package AnyKernel3 ZIP ───────────────────────────────────────
      - name: Build AnyKernel3 Flashable ZIP
        run: |
          echo "::group::Packaging Flashable Kernel ZIP"
          BUILD_DATE=$(date +'%m%d-%H%M')
          KERNEL_ZIP="NoobieKernelRE-GA-ReSUKISU-${BUILD_DATE}.zip"

          cd AnyKernel3
          zip -r9 "../${KERNEL_ZIP}" . -x "*.git*" -x "README.md" -x "*.zip" 2>&1 | tee -a ../build.log
          cd ..

          echo "KERNEL_ZIP=${KERNEL_ZIP}" >> $GITHUB_ENV
          echo "ZIP_PATH=${GITHUB_WORKSPACE}/${KERNEL_ZIP}" >> $GITHUB_ENV
          echo "[✓] Packaged successfully: ${KERNEL_ZIP}"
          echo "::endgroup::"

      # ── Step 10: Extract Kernel Version & Step Summary ──────────────────────
      - name: Generate Build Metadata
        if: always()
        run: |
          VERSION=$(grep -m1 '^VERSION =' Makefile 2>/dev/null | awk '{print $3}' || echo "N/A")
          PATCHLEVEL=$(grep -m1 '^PATCHLEVEL =' Makefile 2>/dev/null | awk '{print $3}' || echo "N/A")
          SUBLEVEL=$(grep -m1 '^SUBLEVEL =' Makefile 2>/dev/null | awk '{print $3}' || echo "N/A")
          EXTRAVERSION=$(grep -m1 '^EXTRAVERSION =' Makefile 2>/dev/null | awk '{print $3}' || echo "")
          KERNEL_FULL_VER="${VERSION}.${PATCHLEVEL}.${SUBLEVEL}${EXTRAVERSION}${CONFIG_LOCALVERSION}"

          {
            echo "### Build Metadata"
            echo "| Parameter | Value |"
            echo "|---|---|"
            echo "| **Status** | \`${{ job.status }}\` |"
            echo "| **Defconfig** | \`${DEFCONFIG}\` |"
            echo "| **GPU Driver** | \`${GPU_DRIVER}\` |"
            echo "| **ReSukiSU** | \`${RESUKISU}\` |"
            echo "| **Kernel Version** | \`${KERNEL_FULL_VER}\` |"
            echo "| **Output ZIP** | \`${KERNEL_ZIP:-N/A}\` |"
            echo "| **Telegram Channel** | [Bootloopzz](https://t.me/Bootloopzz) |"
          } >> "$GITHUB_STEP_SUMMARY"

      # ── Step 11: Upload Build Artifact ──────────────────────────────────────
      - name: Upload Kernel Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.KERNEL_ZIP }}
          path: ${{ env.KERNEL_ZIP }}
          if-no-files-found: error

      # ── Step 12: Telegram Notifications ─────────────────────────────────────
      - name: Telegram Success Report
        if: success()
        continue-on-error: true
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_MESSAGE_THREAD_ID: ${{ secrets.TELEGRAM_MESSAGE_THREAD_ID }}
        run: |
          if [ -f ".github/scripts/telegram-report.sh" ]; then
            bash .github/scripts/telegram-report.sh success "${KERNEL_ZIP:-}"
          else
            echo "[*] .github/scripts/telegram-report.sh not found. Skipping."
          fi

      - name: Telegram Failure Report
        if: failure()
        continue-on-error: true
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_MESSAGE_THREAD_ID: ${{ secrets.TELEGRAM_MESSAGE_THREAD_ID }}
        run: |
          if [ -f ".github/scripts/telegram-report.sh" ]; then
            bash .github/scripts/telegram-report.sh failure "${KERNEL_ZIP:-}"
          else
            echo "[*] .github/scripts/telegram-report.sh not found. Skipping."
          fi
